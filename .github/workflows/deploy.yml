name: Déploiement GitHub Pages

on:
  push:
    # Le dépôt peut être créé avec l'une ou l'autre branche par défaut.
    branches: [main, master]
  workflow_dispatch:

# Requis par actions/deploy-pages : le déploiement s'authentifie par OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Deux pushs rapprochés ne doivent pas se déployer en désordre.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Doit passer AVANT le build : c'est cette action qui nous apprend sous
      # quel chemin le site sera réellement servi.
      # `enablement` crée le site Pages s'il n'existe pas encore et le règle
      # sur « GitHub Actions », sinon l'action échoue par un 404 tant que
      # personne ne l'a activé à la main dans les réglages du dépôt.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Le chemin dépend du mode d'hébergement : /<dépôt>/ pour une page de
      # projet, mais la RACINE pour une page utilisateur ou un domaine
      # personnalisé. Plutôt que de déduire ça du nom du dépôt — ce qui ne
      # peut pas voir un domaine personnalisé — on lit le chemin que
      # l'API Pages renvoie elle-même.
      - name: Normalise le chemin de base
        id: base
        run: |
          p='${{ steps.pages.outputs.base_path }}'
          # L'API renvoie "" ou "/" à la racine, "/dépôt" sinon ; Vite, lui,
          # exige un slash final.
          [ -z "$p" ] && p='/'
          case "$p" in */) ;; *) p="$p/" ;; esac
          echo "Chemin de base retenu : $p"
          echo "value=$p" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.value }}
        run: npm run build

      - name: Repli SPA
        # GitHub Pages ne connaît pas les routes du routeur : une visite
        # directe sur /projets chercherait un fichier qui n'existe pas.
        # Servir la coquille de l'application en 404 laisse le routeur
        # prendre la main. On copie le index.html BUILD, pour que les noms
        # de fichiers avec empreinte restent corrects.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
